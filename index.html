<!doctype html>
<html>
<head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
    <script src="https://unpkg.com/aframe-look-at-component@0.8.0/dist/aframe-look-at-component.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>
    <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
</head>

<body style="margin: 0; overflow: hidden;">
<a-scene
        renderer="logarithmicDepthBuffer: true;"
        embedded
        loading-screen="enabled: false;"
        arjs="sourceType: webcam; debugUIEnabled: false;"
>
    <a-assets>
        <a-asset-item
                id="animated-asset"
                src="assets/asset.glb"
        ></a-asset-item>
    </a-assets>

    <a-entity
            look-at="[gps-camera]"
            animation-mixer="loop: repeat"
            gltf-model="#animated-asset"
            scale="1 1 1"
            gps-entity-place="latitude: 10.772880297936176; longitude: 106.65125823764359;"
    ></a-entity>

    <a-camera gps-camera rotation-reader></a-camera>
</a-scene>

<div id="gps-info" style="position: absolute; top: 10px; left: 10px; color: white; background: rgba(0, 0, 0, 0.5); padding: 5px;">
    Latitude: <span id="latitude">N/A</span>, Longitude: <span id="longitude">N/A</span>
</div>
<div id="version" style="position: absolute; top: 20px ; left: 20px; color: white; background: rgba(0, 0, 0, 0.5); padding: 5px;">
    Version: 1.0.0
</div>

<script>
    if (navigator.geolocation) {
        navigator.geolocation.watchPosition(function(position) {
            document.getElementById('latitude').textContent = position.coords.latitude;
            document.getElementById('longitude').textContent = position.coords.longitude;
        }, function(error) {
            console.error('Error getting GPS data: ', error);
        });
    } else {
        console.error('Geolocation is not supported by this browser.');
    }
</script>
</body>
</html>
